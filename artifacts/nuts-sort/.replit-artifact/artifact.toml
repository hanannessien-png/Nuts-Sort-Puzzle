kind = "mobile"
previewPath = "/"
title = "Nuts Sort Puzzle"
description = "An offline-first nut sorting puzzle with solver-verified endless levels, local progress, five-star scoring, cosmetic collections, daily rewards and optional rewarded ads."
version = "1.0.0"
id = "artifacts/nuts-sort"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23922

[services.development]
run = "pnpm --filter @workspace/nuts-sort run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nuts-sort", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nuts-sort", "run", "serve" ]

[services.env]
PORT = "23922"
BASE_PATH = "/"
